<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Doof Rush</title>
  <link rel="shortcut icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-black select-none overflow-hidden">
  <button id="start-btn" class="px-8 py-4 bg-orange-600 hover:bg-orange-700 text-white font-bold text-2xl rounded-xl shadow-2xl transition cursor-pointer" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 50;">Start Game</button>
  <button id="restart-btn" class="px-8 py-4 bg-orange-600 hover:bg-orange-700 text-white font-bold text-2xl rounded-xl shadow-2xl transition cursor-pointer" style="position: fixed; top: 65%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 50;">Restart</button>
  
  <footer class="fixed bottom-3 left-1/2 -translate-x-1/2 text-white/80 text-sm font-sans tracking-wide z-50 pointer-events-none select-none text-center">
    built with &lt;3 for Haven by <span class="text-orange-400 font-semibold pointer-events-auto">@Zayalan</span> &amp; <span class="text-orange-400 font-semibold pointer-events-auto">@tanzeemrockz</span>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
